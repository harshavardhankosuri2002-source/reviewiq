<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="400" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Phone Outline -->
  <g filter="url(#shadow)">
    <!-- Chassis -->
    <rect x="110" y="70" width="180" height="340" rx="28" fill="url(#bodyGrad)" stroke="#CBD5E1" stroke-width="3" />
    
    <!-- Screen Bezel -->
    <rect x="118" y="78" width="164" height="324" rx="22" fill="#0F172A" fill-opacity="0.04" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Punch Hole Camera -->
    <circle cx="200" cy="94" r="4.5" fill="#1E293B" opacity="0.6" />
    
    <!-- Subtle Screen Content Placeholder / VOX Emblem -->
    <g transform="translate(160, 205)" opacity="0.35">
      <circle cx="40" cy="40" r="32" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="2" />
      <!-- Soundwave / VOX bars -->
      <line x1="28" y1="40" x2="28" y2="40" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
      <line x1="34" y1="33" x2="34" y2="47" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
      <line x1="40" y1="26" x2="40" y2="54" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
      <line x1="46" y1="31" x2="46" y2="49" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
      <line x1="52" y1="37" x2="52" y2="43" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Neutral Label -->
  <text x="200" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="0.5">
    VOX OFFICIAL SPECIFICATION
  </text>
  <text x="200" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">
    Verified Manufacturer Data
  </text>
</svg>
